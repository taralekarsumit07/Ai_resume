<!DOCTYPE html>
<html>
<head>
<title>Forgot Password</title>

<style>
body{
    font-family:Arial;
    background: linear-gradient(135deg,#141e30,#243b55);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:300px;
    padding:25px;
    background:rgba(255,255,255,0.2);
    backdrop-filter: blur(15px);
    border-radius:10px;
    text-align:center;
    color:white;
}
input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:5px;
}
button{
    width:100%;
    padding:10px;
    background:#00c6ff;
    border:none;
    color:white;
    border-radius:5px;
}
</style>

</head>

<body>

<div class="box">
<h2>Reset Password</h2>

<form method="POST">
<input type="email" name="email" placeholder="Enter Email" required>
<input type="password" name="password" placeholder="New Password" required>
<button>Update Password</button>
</form>

<a href="/">Back to Login</a>

</div>

</body>
</html>
